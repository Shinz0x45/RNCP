    <main class="login-page">
        <section class="login-container contact-container">

            <h1>Contactez-nous</h1>
            <p class="login-description">Nous vous répondrons dans les 24 heures.</p>

            <form class="login-form" id="contact-form">

                <div class="form-group">
                    <label for="contact-nom">Nom</label>
                    <div class="input-container">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="contact-nom" name="nom" placeholder="Votre nom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-email">Adresse email</label>
                    <div class="input-container">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="contact-email" name="email" placeholder="exemple@gmail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-sujet">Sujet</label>
                    <div class="input-container">
                        <i class="fa-solid fa-tag"></i>
                        <input type="text" id="contact-sujet" name="sujet" placeholder="Sujet de votre message" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" placeholder="Votre message..." required class="contact-textarea"></textarea>
                </div>

                <!-- Message de succès (caché par défaut) -->
                <div id="contact-success" class="contact-success">
                    <i class="fa-solid fa-circle-check contact-success-icon"></i>Votre message a bien été envoyé !
                </div>

                <button type="submit" class="login-button">
                    <i class="fa-solid fa-paper-plane contact-btn-icon"></i>Envoyer le message
                </button>

            </form>

        </section>
    </main>
