    <!-- ===================== MAIN ===================== -->
    <main class="ajout-tx-main">

        <!-- Message de succès -->
        <div class="ajout-tx-success" id="ajout-tx-success">
            <i class="fa-solid fa-circle-check me-2"></i>
            Transaction enregistrée avec succès !
        </div>

        <!-- Message d'erreur -->
        <div class="ajout-tx-error" id="ajout-tx-error"></div>

        <!-- ---- FORMULAIRE ---- -->
        <form id="ajout-tx-form" class="ajout-tx-form" novalidate>

            <a href="../index.html" class="ajout-tx-back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <h2 class="ajout-tx-page-title">Nouvelle transaction</h2>

            <!-- Type : Dépense / Revenu -->
            <div class="ajout-tx-type-row">
                <button type="button" class="ajout-tx-type-btn active" id="btn-depense" onclick="setTxType('depense')">
                    <i class="fa-solid fa-arrow-trend-down me-2"></i>Dépense
                </button>
                <button type="button" class="ajout-tx-type-btn" id="btn-revenu" onclick="setTxType('revenu')">
                    <i class="fa-solid fa-arrow-trend-up me-2"></i>Revenu
                </button>
            </div>
            <input type="hidden" id="tx-type" value="depense">

            <!-- Montant -->
            <div class="form-group">
                <label class="ajout-tx-label" for="tx-montant">
                    <i class="fa-solid fa-euro-sign me-2" style="color:var(--primary);"></i>Montant
                </label>
                <div class="input-container">
                    <i class="fa-solid fa-coins"></i>
                    <input type="number" id="tx-montant" name="montant" placeholder="0,00" step="0.01" min="0.01"
                        required>
                </div>
            </div>

            <!-- Libellé -->
            <div class="form-group">
                <label class="ajout-tx-label" for="tx-libelle">
                    <i class="fa-solid fa-pen me-2" style="color:var(--primary);"></i>Libellé
                </label>
                <div class="input-container">
                    <i class="fa-solid fa-align-left"></i>
                    <input type="text" id="tx-libelle" name="libelle" placeholder="Ex : Courses, Loyer, Salaire…"
                        required>
                </div>
            </div>

            <!-- Catégorie -->
            <div class="form-group">
                <label class="ajout-tx-label" for="tx-categorie">
                    <i class="fa-solid fa-tag me-2" style="color:var(--primary);"></i>Catégorie
                </label>
                <div class="input-container">
                    <i class="fa-solid fa-list"></i>
                    <select id="tx-categorie" name="categorie" required style="width:100%;height:50px;padding:0 45px;border:1px solid #ddd;border-radius:10px;
                               outline:none;font-size:14px;background-color:#fafafa;appearance:none;cursor:pointer;">
                        <option value="" disabled selected>Choisir une catégorie…</option>
                        <optgroup label="Dépenses courantes">
                            <option value="mobile">📱 Mobile</option>
                            <option value="internet">🌐 Internet</option>
                            <option value="facture">🧾 Facture</option>
                            <option value="électricité">⚡ Électricité</option>
                            <option value="eau">💧 Eau</option>
                        </optgroup>
                        <optgroup label="Loisirs">
                            <option value="cinéma">🎬 Cinéma</option>
                            <option value="restaurant">🍽️ Restaurant</option>
                            <option value="shopping">🛍️ Shopping</option>
                            <option value="voyage">✈️ Voyage</option>
                        </optgroup>
                        <optgroup label="Entrées d'argent">
                            <option value="recharge">💳 Recharge</option>
                            <option value="virement">💸 Virement reçu</option>
                            <option value="salaire">💼 Salaire</option>
                        </optgroup>
                        <optgroup label="Autre">
                            <option value="marché">🛒 Marché</option>
                            <option value="autre">🔖 Autre</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- Date -->
            <div class="form-group">
                <label class="ajout-tx-label" for="tx-date">
                    <i class="fa-solid fa-calendar me-2" style="color:var(--primary);"></i>Date
                </label>
                <div class="input-container">
                    <i class="fa-regular fa-calendar"></i>
                    <input type="date" id="tx-date" name="date" required>
                </div>
            </div>

            <!-- Note (optionnel) -->
            <div class="form-group">
                <label class="ajout-tx-label" for="tx-note">
                    <i class="fa-solid fa-note-sticky me-2" style="color:var(--primary);"></i>Note
                    <span style="font-size:11px;color:#aaa;font-weight:400;">(optionnel)</span>
                </label>
                <textarea id="tx-note" name="note" class="contact-textarea" placeholder="Informations complémentaires…"
                    rows="2"></textarea>
            </div>

            <!-- Bouton valider -->
            <button type="submit" class="login-button mt-2">
                <i class="fa-solid fa-plus me-2"></i>Enregistrer la transaction
            </button>

            <!-- Lien retour -->
            <div class="register-link mt-3">
                <p><a href="../index.html">
                        <i class="fa-solid fa-arrow-left me-1"></i>Retour à l'accueil
                    </a></p>
            </div>

        </form>

    </main>
