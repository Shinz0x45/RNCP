<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Réinitialisation de votre mot de passe">

    <title>Mot de passe oublié - Gestion de Budget</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <div class="login-logo" aria-hidden="true">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>Mot de passe oublié ?</h1>

            <p class="login-description">
                Entrez votre adresse email pour recevoir les instructions
                permettant de réinitialiser votre mot de passe.
            </p>


            <form class="login-form" id="forgot-password-form">

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <div class="input-container">

                        <i class="fa-solid fa-envelope"
                            aria-hidden="true"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Votre adresse email"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <button type="submit" class="login-button">
                    Réinitialiser mon mot de passe
                </button>

            </form>


            <div class="register-link">

                <p>
                    Vous vous souvenez de votre mot de passe ?
                    <a href="connexion.html">
                        Se connecter
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script src="assets/js/main.js"></script>

</body>

</html>
